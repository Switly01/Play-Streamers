<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-play-streamers-desktop' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src https://challenges.cloudflare.com; style-src 'nonce-play-streamers-desktop'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>SW Identity doğrulaması</title>
  <style nonce="play-streamers-desktop">
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;min-height:78px;margin:0;overflow:hidden;background:transparent;color:#aab4c7;font:700 10px/1.35 "Segoe UI",sans-serif}body{display:grid;place-items:center}.shell{display:grid;align-items:center;width:100%;min-height:78px;padding:6px 8px;border:1px solid #ffffff12;border-radius:12px;background:linear-gradient(120deg,#ffffff08,#06091060)}#challenge{display:grid;min-width:0;min-height:65px;place-items:center}
  </style>
</head>
<body>
  <main class="shell"><div id="challenge"></div></main>
  <script nonce="play-streamers-desktop">
    (()=>{
      const params=new URLSearchParams(location.search);
      const flowState=String(params.get('state')||'');
      const requestedOrigin=String(params.get('parent_origin')||'');
      const requestedLanguage=String(params.get('lang')||'tr').toLowerCase();
      const language=['tr','en','de','es','fr','ru','ar','ja'].includes(requestedLanguage)?requestedLanguage:'tr';
      const allowedOrigins=new Set(['http://tauri.localhost','https://tauri.localhost','http://localhost:1420','http://127.0.0.1:1420','http://localhost:4178','http://127.0.0.1:4178']);
      if(!/^[a-f0-9]{48}$/i.test(flowState)||!allowedOrigins.has(requestedOrigin))return;
      const send=token=>parent.postMessage({type:'ps-desktop-turnstile',state:flowState,token},requestedOrigin);
      window.psDesktopTurnstile=()=>{
        if(!window.turnstile)return;
        window.turnstile.render('#challenge',{sitekey:'0x4AAAAAAD4Mr0GZFyPQkCSj',theme:'dark',size:'flexible',language,action:'sw-auth',callback:send,'expired-callback':()=>send(''),'error-callback':()=>send('')})
      };
    })();
  </script>
  <script nonce="play-streamers-desktop" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&amp;onload=psDesktopTurnstile" async defer></script>
</body>
</html>
