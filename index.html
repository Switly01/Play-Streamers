<script>
(() => {
  try {
    const supported = new Set(['tr','en','de','es','fr','ru','ar','ja']);
    const stored = String(localStorage.getItem('ps15-locale') || '').toLowerCase();
    const browserLanguage = (navigator.languages || [navigator.language || ''])
      .map(value => String(value).toLowerCase().split('-')[0])
      .find(value => supported.has(value));
    const language = supported.has(stored) ? stored : (browserLanguage || 'en');
    if (!stored) {
      localStorage.setItem('ps15-locale', language);
      localStorage.setItem('ps-locale-source', 'auto');
    }
    document.documentElement.lang = language;
    document.documentElement.dir = 'ltr';
    document.documentElement.dataset.psSourceLocale = 'tr';
    document.documentElement.dataset.psLiveLocale = language;
    if (language !== 'tr') {
      document.documentElement.classList.add('ps-i18n-booting');
      window.setTimeout(() => document.documentElement.classList.remove('ps-i18n-booting'), 2400);
    }
  } catch (_) {}
})();
</script>

<script id="sw-product-activity-pulse">
(() => {
  const storageKey = "sw-product-visitor";
  const endpoint = "https://api.swcreate.com/api/activity/pulse";
  const visitor = localStorage.getItem(storageKey) || crypto.randomUUID();
  localStorage.setItem(storageKey, visitor);
  const pulse = () => fetch(endpoint, {
    method: "POST",
    credentials: "omit",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ product: "play-streamers", visitor }),
  }).catch(() => {});
  pulse();
  window.setInterval(pulse, 60_000);
})();
</script>
